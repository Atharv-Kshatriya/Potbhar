services:
  - type: web
    name: potbhar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: POTBHAR_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: potbhar-db
          property: connectionString
      - key: FRONTEND_ORIGIN_REGEX
        value: https://[a-z0-9-]+\.netlify\.app

databases:
  - name: potbhar-db
    databaseName: potbhar
    user: potbhar
    plan: 0.1c-256mb
